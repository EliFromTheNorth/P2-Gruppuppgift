
{% extends "base.html" %}

{% block content %}

<h1>Jordskalv</h1>

<table>
    <tr>
        <th>Magnitud</th>
        <th>Plats</th>
        <th>Kategori</th>
    </tr>

    {% for skalv in earthquake_list %}

    <tr>
        <td>{{ skalv.magnitud }}</td>
        <td>{{ skalv.plats }}</td>
        <td>{{ skalv.kategori }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
